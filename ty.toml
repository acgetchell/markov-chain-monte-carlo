# ty.toml
# Astral ty configuration for markov-chain-monte-carlo
# Python covers consumer integration checks; Rust is primary.

[src]
# Scientific notebook types are checked by the shared notebook command.
include = [ "tests/tooling" ]

[environment]
# Match the project's minimum supported Python version.
python-version = "3.14"

[terminal]
# Keep output concise by default.
output-format = "concise"
