[project]
name = "markov-chain-monte-carlo-semgrep"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [ "semgrep==1.182.1" ]

[tool.uv]
package = false
# Semgrep's sdist does not bundle its required native engine.
no-build-package = [ "semgrep" ]
# Retain PyJWT's Base64URL padding fix and the patched MCP 1.x API.
# Semgrep 1.182.1 constrains OpenTelemetry to 1.37. Keep its telemetry family
# aligned with API 1.45.1's tracestate fix for GHSA-xcq7-p3pf-p88h; API-only
# overrides break the older exporter's private imports. Validate scanner compatibility.
override-dependencies = [
    "pyjwt[crypto]>=2.15.1,<3",
    "mcp>=1.30.0,<2",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-instrumentation-requests>=0.66b1,<1",
    "opentelemetry-instrumentation-threading>=0.66b1,<1",
]
