schema = 1
document = "README.md"
payload = "docs/performance/v1/v0.5.2-vs-v0.5.1.comparison.json"
manifest = "docs/performance/v1/v0.5.2-vs-v0.5.1.evidence.json"
svg = "docs/performance/v1/v0.5.2-vs-v0.5.1.svg"
begin = "<!-- PERFORMANCE:BEGIN -->"
end = "<!-- PERFORMANCE:END -->"
unit = "ns"
baseline-label = "v0.5.1"
current-label = "v0.5.2 (prepared tree)"
repository = "acgetchell/markov-chain-monte-carlo"
tag-policy = "prepare"
prose-file = "tooling/performance-interpretation.md"
current-sources = [ "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "src/**/*.rs", "benches/stepping.rs" ]
current-harness = [ "benches/stepping.rs" ]

# Include every unthinned stepping, sampler, and observation workload, regardless
# of timing direction. The full report also retains the nine thinning cases.
rows = [
    { benchmark = "chain_step_by_value", label = "By-value step" },
    { benchmark = "chain_step_mut_accept", label = "In-place accepted step" },
    { benchmark = "chain_step_mut_reject_rollback", label = "In-place rollback step" },
    { benchmark = "chain_step_delayed_accept_reflection", label = "Delayed accepted step" },
    { benchmark = "chain_step_delayed_reject_reflection", label = "Delayed rejected step" },
    { benchmark = "chain_step_delayed_no_plan", label = "Delayed no-plan step" },
    { benchmark = "sampler_run_by_value_100", label = "By-value sampling (100 steps)" },
    { benchmark = "sampler_run_mut_100", label = "In-place sampling (100 steps)" },
    { benchmark = "sampler_run_delayed_reflection_100", label = "Delayed sampling (100 steps)" },
    { benchmark = "observing_run_observing_buffer_100", label = "Buffered observation (100 steps)" },
    { benchmark = "observing_manual_online_sum_100", label = "Manual online sum (100 steps)" },
    { benchmark = "observing_run_observing_into_online_stats_100", label = "Online statistics (100 steps)" },
    { benchmark = "observing_run_observing_into_binning_100", label = "Binning analysis (100 steps)" },
]
links = [
    { label = "Full timing report", path = "docs/performance/v1/performance.md" },
    { label = "Comparison evidence", path = "docs/performance/v1/v0.5.2-vs-v0.5.1.comparison.json" },
    { label = "Provenance", path = "docs/performance/v1/v0.5.2-vs-v0.5.1.evidence.json" },
    { label = "CSV export", path = "docs/performance/v1/v0.5.2-vs-v0.5.1.csv" },
]

