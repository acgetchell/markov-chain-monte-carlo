# Preserve the existing 13 unthinned public workflows, regardless of timing
# direction. The complete retained run also includes all nine thinning cases.
schema = 2
document = "README.md"
archive = "docs/performance/runs"
measurement = "tooling/measurement-release-signal.toml"
release = true
trial = 1
repository = "acgetchell/markov-chain-monte-carlo"
tag-policy = "prepare"
begin = "<!-- PERFORMANCE:BEGIN -->"
end = "<!-- PERFORMANCE:END -->"
statistic = "median"
unit = "ns"
missing = "error"
prose-file = "tooling/performance-release-interpretation.md"
csv = "docs/assets/release-performance.csv"
svg = "docs/assets/release-performance.svg"
rows = [
    { key = "chain/step_by_value", label = "By-value step" },
    { key = "chain/step_mut_accept", label = "In-place accepted step" },
    { key = "chain/step_mut_reject_rollback", label = "In-place rollback step" },
    { key = "chain/step_delayed_accept_reflection", label = "Delayed accepted step" },
    { key = "chain/step_delayed_reject_reflection", label = "Delayed rejected step" },
    { key = "chain/step_delayed_no_plan", label = "Delayed no-plan step" },
    { key = "sampler/run_by_value_100", label = "By-value sampling (100 steps)" },
    { key = "sampler/run_mut_100", label = "In-place sampling (100 steps)" },
    { key = "sampler/run_delayed_reflection_100", label = "Delayed sampling (100 steps)" },
    { key = "observing/run_observing_buffer_100", label = "Buffered observation (100 steps)" },
    { key = "observing/manual_online_sum_100", label = "Manual online sum (100 steps)" },
    { key = "observing/run_observing_into_online_stats_100", label = "Online statistics (100 steps)" },
    { key = "observing/run_observing_into_binning_100", label = "Binning analysis (100 steps)" },
]
series = [
    { name = "stepping/baseline", label = "Baseline", label-version = "release", rows = { "chain/step_by_value" = "chain/step_by_value", "chain/step_mut_accept" = "chain/step_mut_accept", "chain/step_mut_reject_rollback" = "chain/step_mut_reject_rollback", "chain/step_delayed_accept_reflection" = "chain/step_delayed_accept_reflection", "chain/step_delayed_reject_reflection" = "chain/step_delayed_reject_reflection", "chain/step_delayed_no_plan" = "chain/step_delayed_no_plan", "sampler/run_by_value_100" = "sampler/run_by_value_100", "sampler/run_mut_100" = "sampler/run_mut_100", "sampler/run_delayed_reflection_100" = "sampler/run_delayed_reflection_100", "observing/run_observing_buffer_100" = "observing/run_observing_buffer_100", "observing/manual_online_sum_100" = "observing/manual_online_sum_100", "observing/run_observing_into_online_stats_100" = "observing/run_observing_into_online_stats_100", "observing/run_observing_into_binning_100" = "observing/run_observing_into_binning_100" } },
    { name = "stepping/current", label = "Current", label-version = "release", rows = { "chain/step_by_value" = "chain/step_by_value", "chain/step_mut_accept" = "chain/step_mut_accept", "chain/step_mut_reject_rollback" = "chain/step_mut_reject_rollback", "chain/step_delayed_accept_reflection" = "chain/step_delayed_accept_reflection", "chain/step_delayed_reject_reflection" = "chain/step_delayed_reject_reflection", "chain/step_delayed_no_plan" = "chain/step_delayed_no_plan", "sampler/run_by_value_100" = "sampler/run_by_value_100", "sampler/run_mut_100" = "sampler/run_mut_100", "sampler/run_delayed_reflection_100" = "sampler/run_delayed_reflection_100", "observing/run_observing_buffer_100" = "observing/run_observing_buffer_100", "observing/manual_online_sum_100" = "observing/manual_online_sum_100", "observing/run_observing_into_online_stats_100" = "observing/run_observing_into_online_stats_100", "observing/run_observing_into_binning_100" = "observing/run_observing_into_binning_100" } },
]
comparisons = [ { numerator = "stepping/baseline", denominator = "stepping/current" } ]
references = [
    { path = "Cargo.toml", pattern = '^version = "(?P<value>[^"]+)"\r?$', source = "version" },
    { path = "docs/performance/current.md", pattern = '^- current: available .*; release (?P<value>[^;]+); revision', source = "tag", count = 2 },
    { path = "docs/performance/current.md", pattern = '^- baseline: available .*; release (?P<value>[^;]+); revision', source = "previous-tag", count = 2 },
]

[table]
comparison-columns = [ "ratio" ]
ratio-headings = [ "Baseline / current" ]
intervals = "below"
timing-legend = true

[provenance.baseline]
[provenance.current]
