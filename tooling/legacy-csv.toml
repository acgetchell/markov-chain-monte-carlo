# Bounded conversion of the retained v0.4.2 evidence; no legacy writer.
# Retire when all consumers use verified shared companions instead of conversion.
schema = 1
schema-field = "schema"
schemas = [ "mcmc-performance-provenance/v2" ]
hash-field = "csv_sha256"
header = [ "schema_version", "suite", "scope", "benchmark", "coverage", "baseline_point_ns", "baseline_lower_ns", "baseline_upper_ns", "current_point_ns", "current_lower_ns", "current_upper_ns" ]
benchmark = "benchmark"
statistic = "median"
unit = "ns"
equal = [
    [ "release.baseline_tag", "measurement.baseline.tag" ],
    [ "release.current_tag", "measurement.current.tag" ],
    [ "report.baseline_label", "release.baseline_tag" ],
    [ "measurement.baseline.operating_system", "measurement.current.operating_system" ],
    [ "measurement.baseline.architecture", "measurement.current.architecture" ],
    [ "measurement.baseline.cpu_model", "measurement.current.cpu_model" ],
]

[constants]
schema_version = "criterion-comparison/v1"
suite = "stepping"
scope = "release-signal"

[assertions]
"csv_schema" = "criterion-comparison/v1"
"report.statistic" = "median"
"release.current_tag" = "v0.4.2"
"release.baseline_tag" = "v0.4.1"
"measurement.mode" = "local-isolated-worktrees"
"measurement.working_tree_applied" = true
"report.current_label" = "v0.4.2 working tree"
"measurement.current.commit" = "ef21cc6430329cefa64497f7eed1ffa8e669bea3"
"measurement.baseline.commit" = "b0d93a1b386aaec7222866fef24feeef6cf13475"

[coverage]
column = "coverage"
common = "comparable"
added = "current_only"
missing = "baseline_only"

[baseline]
point = "baseline_point_ns"
lower = "baseline_lower_ns"
upper = "baseline_upper_ns"

[current]
point = "current_point_ns"
lower = "current_lower_ns"
upper = "current_upper_ns"

[sources.baseline]
revision = "measurement.baseline.commit"
release = "release.baseline_tag"
record = "measurement.baseline"

[sources.current]
revision = "measurement.current.commit"
release = "release.current_tag"
record = "measurement.current"
