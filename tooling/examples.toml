schema = 1
profile = "dev"
timeout = 300
build-timeout = 1800
exclude = [ "ising_1d" ]

[examples.adaptive_normal]
features = [ "benchmarks", "serde", "tracing" ]
expect = [ "Adaptive normal sampling", "Frozen proposal width", "Sample mean", "Acceptance rate" ]

[examples.benchmark_distributions]
features = [ "benchmarks", "serde", "tracing" ]
expect = [ "Benchmark distributions", "Rosenbrock", "NealsFunnel", "GaussianMixture", "Banana", "Cross covariance", "mean ESS", "Acceptance rate" ]

[examples.detailed_balance]
features = [ "benchmarks", "serde", "tracing" ]
expect = [ "Detailed balance checks passed", "by-value residual" ]

[examples.normal_1d]
features = [ "benchmarks", "serde", "tracing" ]
expect = [ "Sample mean", "Acceptance rate" ]

[examples.iterator_sampling]
features = [ "benchmarks", "serde", "tracing" ]
expect = [ "Sample mean", "Acceptance rate" ]

[examples.delayed_chunked_telemetry]
features = [ "benchmarks", "serde", "tracing" ]
expect = [ "Per-step telemetry", "Delayed chunked telemetry complete" ]

[examples.additive_target_bias]
features = [ "benchmarks", "serde", "tracing" ]
expect = [ "AdditiveTarget bias example", "observed P(true)" ]
