schema = 1

[[checks]]
name = "adaptive_normal"
command = [ "target/debug/examples/adaptive_normal" ]
expect = [ "Adaptive normal sampling", "Frozen proposal width", "Sample mean", "Acceptance rate" ]

[[checks]]
name = "benchmark_distributions"
command = [ "target/debug/examples/benchmark_distributions" ]
expect = [ "Benchmark distributions", "Rosenbrock", "NealsFunnel", "GaussianMixture", "Banana", "Cross covariance", "mean ESS", "Acceptance rate" ]

[[checks]]
name = "diagnostics"
command = [ "target/debug/examples/diagnostics" ]
expect = [ "Scalar diagnostics", "chain 0: ACF[1]=", "chain 1: ACF[1]=", "chain 2: ACF[1]=", "chain 3: ACF[1]=", "chain 0: mean ESS=", "chain 1: mean ESS=", "chain 2: mean ESS=", "chain 3: mean ESS=", "Multi-chain mean ESS:", "Multi-chain bulk ESS:", "Tail ESS:", "Mean MCSE:", "Quantile p=0.05:", "Quantile p=0.5:", "Quantile p=0.95:", "ESS/second=", "Classical split R-hat:", "Rank-normalized split R-hat component:", "Folded rank-normalized split R-hat component:", "Combined R-hat:", "diagnostics JSON:" ]

[[checks]]
name = "detailed_balance"
command = [ "target/debug/examples/detailed_balance" ]
expect = [ "Detailed balance checks passed", "by-value residual" ]

[[checks]]
name = "normal_1d"
command = [ "target/debug/examples/normal_1d" ]
expect = [ "Sample mean", "Acceptance rate" ]

[[checks]]
name = "ising_1d"
command = [ "target/debug/examples/ising_1d" ]
expect = [ "<m>", "acceptance rate", "energy autocorrelation time:", "magnetization autocorrelation time:", "energy ESS:", "energy split R-hat:", "diagnostics JSON:" ]

[[checks]]
name = "iterator_sampling"
command = [ "target/debug/examples/iterator_sampling" ]
expect = [ "Sample mean", "Acceptance rate" ]

[[checks]]
name = "delayed_chunked_telemetry"
command = [ "target/debug/examples/delayed_chunked_telemetry" ]
expect = [ "Per-step telemetry", "Delayed chunked telemetry complete" ]

[[checks]]
name = "additive_target_bias"
command = [ "target/debug/examples/additive_target_bias" ]
expect = [ "AdditiveTarget bias example", "observed P(true)" ]
