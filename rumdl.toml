[global]
line-length = 160
disable = [
    "MD034",
    "MD057",
]

[MD013]
line-length = 160
reflow = true

[MD033]
# The generated README benchmark table uses <br> for timing intervals.
allowed-elements = [ "a", "br" ]

[per-file-ignores]
# Keep the generated changelog archives in their original format.
"docs/archives/changelog/*.md" = [ "MD076" ]
