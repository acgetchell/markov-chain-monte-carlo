---
# Repository-owned Semgrep/OpenGrep rules.
#
# Keep this file small and project-specific. Broad default/community rules tend
# to duplicate Clippy, cargo-audit, and CodeQL. These rules encode repository
# policies not covered by the language-specific linters.

rules:
  - id: mcmc.python.git-stdin-binary-transport
    languages:
      - python
    severity: WARNING
    message: "Keep Git stdin byte-exact: use text=False and do not enable encoding, errors, or universal_newlines on the subprocess."
    metadata:
      category: correctness
      rationale: "Windows text pipes rewrite LF and CRLF, corrupting hashes, patches, and verbatim tag messages before Git receives them."
    paths:
      include:
        - "/scripts/**/*.py"
        - "/tests/semgrep/scripts/**/*.py"
      exclude:
        - "/scripts/tests/**"
        - "/tests/semgrep/scripts/tests/**"
    patterns:
      - pattern-inside: |
          def run_git_command_with_input(...):
              ...
      - pattern-either:
          - pattern: subprocess.run(..., input=$INPUT, ...)
          - pattern: subprocess.Popen(...)
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: subprocess.run(..., input=$INPUT, ...)
                  - pattern: subprocess.Popen(...)
              - pattern-not: $CALL(..., text=False, ...)
          - patterns:
              - pattern-either:
                  - pattern: subprocess.run(..., encoding=$ENCODING, ...)
                  - pattern: subprocess.Popen(..., encoding=$ENCODING, ...)
              - pattern-not: $CALL(..., encoding=None, ...)
          - patterns:
              - pattern-either:
                  - pattern: subprocess.run(..., errors=$ERRORS, ...)
                  - pattern: subprocess.Popen(..., errors=$ERRORS, ...)
              - pattern-not: $CALL(..., errors=None, ...)
          - patterns:
              - pattern-either:
                  - pattern: subprocess.run(..., universal_newlines=$NEWLINES, ...)
                  - pattern: subprocess.Popen(..., universal_newlines=$NEWLINES, ...)
              - pattern-not: $CALL(..., universal_newlines=False, ...)
              - pattern-not: $CALL(..., universal_newlines=None, ...)

  - id: mcmc.python.git-stdin-use-shared-helper
    languages:
      - python
    severity: WARNING
    message: "Send Git stdin through subprocess_utils.run_git_command_with_input so Windows cannot translate the input bytes."
    metadata:
      category: correctness
      rationale: "The shared Git-input helper preserves exact encoded input; the generic text wrappers do not make that guarantee."
    paths:
      include:
        - "/scripts/**/*.py"
        - "/tests/semgrep/scripts/**/*.py"
      exclude:
        - "/scripts/tests/**"
        - "/tests/semgrep/scripts/tests/**"
    patterns:
      - pattern-either:
          - pattern: run_git_command(..., input=$INPUT, ...)
          - pattern: subprocess_utils.run_git_command(..., input=$INPUT, ...)
          - pattern: run_safe_command("git", ..., input=$INPUT, ...)
          - pattern: subprocess_utils.run_safe_command("git", ..., input=$INPUT, ...)
          - pattern: subprocess.run(["git", ...], ..., input=$INPUT, ...)
      - pattern-not: $CALL(..., input=None, ...)

  - id: mcmc.python.text-writes-explicit-policy
    languages:
      - python
    severity: WARNING
    message: 'Pass explicit non-None encoding and newline keywords: UTF-8 with newline="\n" for generated LF text, or newline="" to preserve supplied endings.'
    metadata:
      category: correctness
      rationale: "Platform-default text writes make artifact bytes depend on the host OS, even when Git checkout conversion is disabled."
    paths:
      include:
        - "/scripts/**/*.py"
        - "/tests/semgrep/scripts/**/*.py"
      exclude:
        - "/scripts/tests/**"
        - "/tests/semgrep/scripts/tests/**"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $PATH.write_text(...)
              - patterns:
                  - pattern-either:
                      - pattern: open($PATH, $MODE, ...)
                      - pattern: open(..., mode=$MODE, ...)
                      - pattern: io.open($PATH, $MODE, ...)
                      - pattern: io.open(..., mode=$MODE, ...)
                      - pattern: $PATH.open($MODE, ...)
                      - pattern: $PATH.open(..., mode=$MODE, ...)
                      - pattern: os.fdopen($FD, $MODE, ...)
                      - pattern: os.fdopen(..., mode=$MODE, ...)
                      - pattern: tempfile.NamedTemporaryFile($MODE, ...)
                      - pattern: tempfile.NamedTemporaryFile(..., mode=$MODE, ...)
                      - pattern: tempfile.TemporaryFile($MODE, ...)
                      - pattern: tempfile.TemporaryFile(..., mode=$MODE, ...)
                  - metavariable-regex:
                      metavariable: $MODE
                      regex: ^['"](?=[^'"]*[wax+])(?![^'"]*b)[rawxt+]+['"]$
          - pattern-not: $CALL(..., encoding=$ENCODING, ..., newline=$NEWLINE, ...)
      - pattern: $PATH.write_text(..., encoding=None, ...)
      - pattern: $PATH.write_text(..., newline=None, ...)
      - patterns:
          - pattern-either:
              - pattern: open($PATH, $MODE, ..., encoding=None, ...)
              - pattern: open(..., mode=$MODE, ..., encoding=None, ...)
              - pattern: io.open($PATH, $MODE, ..., encoding=None, ...)
              - pattern: io.open(..., mode=$MODE, ..., encoding=None, ...)
              - pattern: $PATH.open($MODE, ..., encoding=None, ...)
              - pattern: $PATH.open(..., mode=$MODE, ..., encoding=None, ...)
              - pattern: os.fdopen($FD, $MODE, ..., encoding=None, ...)
              - pattern: os.fdopen(..., mode=$MODE, ..., encoding=None, ...)
              - pattern: tempfile.NamedTemporaryFile($MODE, ..., encoding=None, ...)
              - pattern: tempfile.NamedTemporaryFile(..., mode=$MODE, ..., encoding=None, ...)
              - pattern: tempfile.TemporaryFile($MODE, ..., encoding=None, ...)
              - pattern: tempfile.TemporaryFile(..., mode=$MODE, ..., encoding=None, ...)
              - pattern: open($PATH, $MODE, ..., newline=None, ...)
              - pattern: open(..., mode=$MODE, ..., newline=None, ...)
              - pattern: io.open($PATH, $MODE, ..., newline=None, ...)
              - pattern: io.open(..., mode=$MODE, ..., newline=None, ...)
              - pattern: $PATH.open($MODE, ..., newline=None, ...)
              - pattern: $PATH.open(..., mode=$MODE, ..., newline=None, ...)
              - pattern: os.fdopen($FD, $MODE, ..., newline=None, ...)
              - pattern: os.fdopen(..., mode=$MODE, ..., newline=None, ...)
              - pattern: tempfile.NamedTemporaryFile($MODE, ..., newline=None, ...)
              - pattern: tempfile.NamedTemporaryFile(..., mode=$MODE, ..., newline=None, ...)
              - pattern: tempfile.TemporaryFile($MODE, ..., newline=None, ...)
              - pattern: tempfile.TemporaryFile(..., mode=$MODE, ..., newline=None, ...)
          - metavariable-regex:
              metavariable: $MODE
              regex: ^['"](?=[^'"]*[wax+])(?![^'"]*b)[rawxt+]+['"]$

  - id: mcmc.rust.no-stdio-diagnostics-in-src
    languages:
      - rust
    severity: WARNING
    message: "Avoid stdout/stderr diagnostics in library src/ code."
    metadata:
      category: maintainability
      rationale: "Library code should return data or typed errors rather than printing diagnostics."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern: println!(...)
          - pattern: eprintln!(...)
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-nonfinite-unwrap-defaults
    languages:
      - rust
    severity: WARNING
    message: "Do not hide failed floating-point conversion with NaN or infinity defaults."
    metadata:
      category: correctness
      rationale: "MCMC probability code should reject or propagate non-finite values explicitly."
    paths:
      include:
        - "/src/**/*.rs"
    pattern-either:
      - pattern: $VALUE.unwrap_or(f64::NAN)
      - pattern: $VALUE.unwrap_or(f64::INFINITY)
      - pattern: $VALUE.unwrap_or(f64::NEG_INFINITY)
      - pattern: $VALUE.unwrap_or(std::f64::NAN)
      - pattern: $VALUE.unwrap_or(std::f64::INFINITY)
      - pattern: $VALUE.unwrap_or(std::f64::NEG_INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| f64::NAN)
      - pattern: $VALUE.unwrap_or_else(|| f64::INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| f64::NEG_INFINITY)

  - id: mcmc.rust.no-algebraic-f64-operations
    languages:
      - rust
    severity: WARNING
    message: "Use ordinary IEEE-754 operators or deliberate f64::mul_add; algebraic f64 operations are forbidden."
    metadata:
      category: correctness
      rationale: >-
        Algebraic f64 operations permit real-number transformations with
        unspecified precision. Reassociation and relaxed NaN, infinity, or
        signed-zero behavior can change acceptance decisions, convergence
        statistics, diagnostics, and seeded-run reproducibility.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/**/*.rs"
        - "/examples/**/*.rs"
        - "/benches/**/*.rs"
    pattern-either:
      - patterns:
          - pattern: $VALUE.algebraic_add(...)
          - metavariable-type:
              metavariable: $VALUE
              type: f64
      - patterns:
          - pattern: $VALUE.algebraic_sub(...)
          - metavariable-type:
              metavariable: $VALUE
              type: f64
      - patterns:
          - pattern: $VALUE.algebraic_mul(...)
          - metavariable-type:
              metavariable: $VALUE
              type: f64
      - patterns:
          - pattern: $VALUE.algebraic_div(...)
          - metavariable-type:
              metavariable: $VALUE
              type: f64
      - patterns:
          - pattern: $VALUE.algebraic_rem(...)
          - metavariable-type:
              metavariable: $VALUE
              type: f64
      - patterns:
          - pattern: f64::algebraic_add
          - pattern-not-inside: f64::algebraic_add(...)
      - patterns:
          - pattern: f64::algebraic_sub
          - pattern-not-inside: f64::algebraic_sub(...)
      - patterns:
          - pattern: f64::algebraic_mul
          - pattern-not-inside: f64::algebraic_mul(...)
      - patterns:
          - pattern: f64::algebraic_div
          - pattern-not-inside: f64::algebraic_div(...)
      - patterns:
          - pattern: f64::algebraic_rem
          - pattern-not-inside: f64::algebraic_rem(...)
      - patterns:
          - pattern: $TYPE::algebraic_add(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_sub(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_mul(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_div(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_rem(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_add
          - pattern-not-inside: $TYPE::algebraic_add(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_sub
          - pattern-not-inside: $TYPE::algebraic_sub(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_mul
          - pattern-not-inside: $TYPE::algebraic_mul(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_div
          - pattern-not-inside: $TYPE::algebraic_div(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: $TYPE::algebraic_rem
          - pattern-not-inside: $TYPE::algebraic_rem(...)
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: <$TYPE>::algebraic_add
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: <$TYPE>::algebraic_sub
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: <$TYPE>::algebraic_mul
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: <$TYPE>::algebraic_div
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - patterns:
          - pattern: <$TYPE>::algebraic_rem
          - pattern-inside: |
              type $TYPE = f64;
              ...
      - pattern: <f64>::algebraic_add
      - pattern: <f64>::algebraic_sub
      - pattern: <f64>::algebraic_mul
      - pattern: <f64>::algebraic_div
      - pattern: <f64>::algebraic_rem

  - id: mcmc.rust.no-production-unwrap-panic
    languages:
      - rust
    severity: WARNING
    message: "Avoid unwrap/expect/panic in non-test src/ code; return typed errors or document an invariant."
    metadata:
      category: correctness
      rationale: "Public library paths should fail explicitly rather than panicking on user input."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern: $VALUE.unwrap()
          - pattern: $VALUE.expect($MESSAGE)
          - pattern: panic!(...)
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-public-unchecked-apis
    languages:
      - rust
    severity: WARNING
    message: "Keep *_unchecked APIs private so invalid-state escape hatches do not become public contracts."
    metadata:
      category: correctness
      rationale: "Unchecked helpers should stay behind validated constructors, parsers, or setters."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-regex: '^\s*pub(?:\([^)]*\))?\s+(?:const\s+|async\s+|unsafe\s+)?fn\s+[A-Za-z_][A-Za-z0-9_]*_unchecked\s*\('
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-infallible-statistics-f64-ingestion
    languages:
      - rust
    severity: WARNING
    message: "OnlineStats and BinningAnalysis must ingest raw f64 samples through fallible APIs."
    metadata:
      category: correctness
      rationale: "Raw f64 measurements can be NaN, infinite, or overflow accumulator state; accepted samples should carry validation evidence."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-either:
      - pattern-regex: '^\s*pub\s+fn\s+push\s*\(\s*&mut\s+self\s*,\s*[A-Za-z_][A-Za-z0-9_]*\s*:\s*f64\s*\)'
      - pattern-regex: '^\s*impl\s+(?:(?:std::)?iter::)?(?:Extend|FromIterator|Sum)\s*<\s*f64\s*>\s+for\s+(?:OnlineStats|BinningAnalysis)\b'

  - id: mcmc.rust.invariant-fields-use-refined-types
    languages:
      - rust
    severity: WARNING
    message: "Keep established invariant-bearing fields stored as refined types, not raw primitives."
    metadata:
      category: correctness
      rationale: "Positive counts and validated sample thresholds should remain unrepresentable as zero once parsed."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-either:
      - patterns:
          - pattern-inside: |
              pub struct DetailedBalanceConfig {
                  ...
              }
          - pattern-regex: '^\s*samples\s*:\s*usize\b'
      - patterns:
          - pattern-inside: |
              pub struct DetailedBalanceConfig {
                  ...
              }
          - pattern-regex: '^\s*min_hits\s*:\s*usize\b'
      - patterns:
          - pattern-inside: |
              pub struct DiscreteProposalRatio {
                  ...
              }
          - pattern-regex: '^\s*forward_site_count\s*:\s*usize\b'

  - id: mcmc.rust.thinning-interval-parameters-use-refined-type
    languages:
      - rust
    severity: WARNING
    message: "Accept ThinningInterval in *_with_thinning APIs so zero is rejected before sampler execution."
    metadata:
      category: correctness
      rationale: "A proof-bearing interval removes repeated zero checks and makes division by zero unrepresentable in thinning loops."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-regex: >-
      (?s)^\s*pub\s+fn\s+[A-Za-z_][A-Za-z0-9_]*_with_thinning(?:\s*<[^\{;]*>)?\s*\([^)]*\bthin_interval\s*:\s*usize\b

  - id: mcmc.rust.step-telemetry-fields-private
    languages:
      - rust
    severity: WARNING
    message: "Keep Step telemetry fields private and expose read-only accessors so outcome-dependent fields cannot be mutated independently."
    metadata:
      category: correctness
      rationale: "Accepted, rejected, and no-proposal telemetry require coordinated outcome, log-probability, and acceptance-ratio fields."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-inside: |
          pub struct Step<$INFO> {
              ...
          }
      - pattern-regex: '^\s*pub\s+(?:outcome|info|log_prob_before|log_prob_after|log_alpha)\s*:'

  - id: mcmc.rust.no-public-unit-validators
    languages:
      - rust
    severity: WARNING
    message: "Prefer returning a refined value from constructors/parsers over public validate_* -> Result<(), _> APIs."
    metadata:
      category: correctness
      rationale: "A unit-returning validator discards validation evidence that a refined type could carry."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    patterns:
      - pattern-regex: '^\s*pub(?:\([^)]*\))?\s+(?:const\s+|async\s+|unsafe\s+)?fn\s+validate_[A-Za-z_][A-Za-z0-9_]*\s*\([^)]*\)\s*->\s*Result\s*<\s*\(\s*\)\s*,'
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-box-dyn-error-in-src
    languages:
      - rust
    severity: WARNING
    message: "Use McmcError or another typed error in src/ instead of dynamic error erasure."
    metadata:
      category: maintainability
      rationale: "Public fallible paths should preserve typed error contracts."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-regex: >-
          ^[ \t]*[^\n]*(\bBox\s*<\s*dyn\s+(std::error::)?Error\b|&\s*dyn\s+(std::error::)?Error\b|\banyhow::Error\b)
      - pattern-not-regex: '^[ \t]*(//|///|/\*|\*)'
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-box-dyn-error-in-examples-benches
    languages:
      - rust
    severity: WARNING
    message: "Use a concrete crate error in examples and benchmarks instead of dynamic error erasure."
    metadata:
      category: maintainability
      rationale: "Examples and benchmarks should model typed error handling that users can copy."
    paths:
      include:
        - "/examples/**/*.rs"
        - "/benches/**/*.rs"
    patterns:
      - pattern-regex: >-
          ^[ \t]*[^\n]*(\bBox\s*<\s*dyn\s+(std::error::)?Error\b|&\s*dyn\s+(std::error::)?Error\b|\banyhow::Error\b)
      - pattern-not-regex: '^[ \t]*(//|///|/\*|\*)'

  - id: mcmc.rust.no-box-dyn-error-in-doctests
    languages:
      - rust
    severity: WARNING
    message: "Use concrete error types in doctests instead of Box<dyn Error> or other dynamic error erasure."
    metadata:
      category: maintainability
      rationale: "Doctests are public examples and should model typed, copyable error handling."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern-regex: >-
              ^\s*(//!|///).*dyn\s+(std::error::)?Error
          - pattern-regex: >-
              ^\s*(//!|///).*anyhow::Error
          - pattern-regex: >-
              (?s)/\*\*.*?(Box\s*<\s*dyn\s+(std::error::)?Error|&\s*dyn\s+(std::error::)?Error|anyhow::Error).*?\*/
          - pattern-regex: >-
              (?s)/\*!.*?(Box\s*<\s*dyn\s+(std::error::)?Error|&\s*dyn\s+(std::error::)?Error|anyhow::Error).*?\*/

  - id: mcmc.rust.no-unwrap-expect-in-doctests
    languages:
      - generic
    severity: WARNING
    message: "Use fallible doctest flow instead of unwrap() or expect() in public documentation examples."
    metadata:
      category: correctness
      rationale: "Public Rust documentation examples should model typed error handling with concrete errors and ? rather than panic-based control flow."
    paths:
      include:
        - "/src/**/*.rs"
    pattern-either:
      - pattern-regex: '^\s*//[!/]\s*(?:#\s*)?(?:\s*\.|.*(?:\b[\w:]+|[\]\)?])\.)(unwrap|expect)\s*\('
      - pattern-regex: '(?s)/\*\*.*?(?:\b[\w:]+|[\]\)?])\.(unwrap|expect)\s*\(.*?\*/'
      - pattern-regex: '(?s)/\*!.*?(?:\b[\w:]+|[\]\)?])\.(unwrap|expect)\s*\(.*?\*/'

  - id: mcmc.rust.no-unwrap-expect-in-benches-examples
    languages:
      - rust
    severity: WARNING
    message: "Use explicit fixture error handling instead of unwrap() or expect() in benchmarks and examples."
    metadata:
      category: correctness
      rationale: "Benchmarks and public examples should keep failure modes explicit so users and CI see the operation that failed instead of a panic-only unwrap/expect path."
    paths:
      include:
        - "/benches/**/*.rs"
        - "/examples/**/*.rs"
    pattern-either:
      - pattern: $VALUE.unwrap()
      - pattern: $VALUE.expect(...)

  - id: mcmc.rust.public-error-enums-non-exhaustive
    languages:
      - rust
    severity: WARNING
    message: "Public error enums must be #[non_exhaustive] so adding variants remains API-safe."
    metadata:
      category: maintainability
      rationale: >-
        Error enums grow as diagnostics become more precise; non-exhaustive
        public enums keep that growth additive for downstream callers.
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/semgrep/src/**/*.rs"
    pattern-regex: '(?m)(?<!#\[non_exhaustive\]\n)^\s*pub\s+enum\s+[A-Za-z_][A-Za-z0-9_]*Error(?:<[^>{}]*)?\s*\{'

  - id: mcmc.rust.no-clippy-allow-lints
    languages:
      - rust
    severity: WARNING
    message: "Use #[expect(..., reason = ...)] instead of #[allow(...)] for Clippy suppressions."
    metadata:
      category: maintainability
      rationale: "Clippy suppressions should be checked by the compiler and carry a stable reason."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/**/*.rs"
        - "/examples/**/*.rs"
      exclude:
        - "/tests/semgrep/**"
    pattern-regex: '^\s*#\s*\[\s*allow\s*\(\s*clippy::'

  - id: mcmc.rust.expect-requires-reason
    languages:
      - rust
    severity: WARNING
    message: 'Add reason = "..." to #[expect(...)] so lint suppressions remain auditable.'
    metadata:
      category: maintainability
      rationale: "Documented expectations make lint suppressions reviewable and less likely to go stale."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/**/*.rs"
        - "/examples/**/*.rs"
      exclude:
        - "/tests/semgrep/**"
    patterns:
      - pattern-regex: '^\s*#\s*\[\s*expect\s*\([^\]\n]*\)\s*\]'
      - pattern-not-regex: '\breason\s*='

  - id: mcmc.rust.prefer-prelude-imports-in-examples
    languages:
      - rust
    severity: WARNING
    message: "Use markov_chain_monte_carlo::prelude imports in examples instead of deep module paths."
    metadata:
      category: maintainability
      rationale: "Examples should model the public import surface users are expected to copy."
    paths:
      include:
        - "/examples/**/*.rs"
    patterns:
      - pattern-regex: '^\s*use\s+markov_chain_monte_carlo::(chain|error|sampler|traits)::'
      - pattern-not-regex: '^\s*use\s+markov_chain_monte_carlo::prelude::'

  - id: mcmc.github-actions.external-action-sha-pinned
    languages:
      - regex
    severity: WARNING
    message: "Pin external GitHub Actions to a full 40-character commit SHA."
    metadata:
      category: security
      rationale: "Moving tags can change workflow behavior without review."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/github-actions/**/*.yml"
        - "/github-actions/**/*.yaml"
        - "/tests/semgrep/github-actions/**/*.yml"
        - "/tests/semgrep/github-actions/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^\s*uses:\s*(?!\./)(?!docker://)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?@(?![a-fA-F0-9]{40}(?:\s+#|$))[^\s#]+'

  - id: mcmc.github-actions.external-action-approved-allowlist
    languages:
      - regex
    severity: WARNING
    message: "Use only approved external GitHub Actions, or update the repository allowlist deliberately."
    metadata:
      category: security
      rationale: "A small allowlist keeps workflow supply-chain review explicit."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/github-actions/**/*.yml"
        - "/github-actions/**/*.yaml"
        - "/tests/semgrep/github-actions/**/*.yml"
        - "/tests/semgrep/github-actions/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^\s*uses:\s*(?!\./)(?!docker://)(?!(?:actions/checkout|actions/cache|actions/download-artifact|actions/upload-artifact|actions/setup-python|actions-rust-lang/setup-rust-toolchain|astral-sh/setup-uv|swatinem/rust-cache|taiki-e/cache-cargo-install-action|github/codeql-action/(?:upload-sarif|init|analyze)|codecov/codecov-action|zizmorcore/zizmor-action)@)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?@'

  - id: mcmc.github-actions.external-action-version-comment
    languages:
      - regex
    severity: WARNING
    message: "Keep a readable version comment next to external GitHub Action SHA pins."
    metadata:
      category: maintainability
      rationale: "Version comments make Dependabot updates and human review manageable."
    paths:
      include:
        - "/.github/workflows/**/*.yml"
        - "/.github/workflows/**/*.yaml"
        - "/github-actions/**/*.yml"
        - "/github-actions/**/*.yaml"
        - "/tests/semgrep/github-actions/**/*.yml"
        - "/tests/semgrep/github-actions/**/*.yaml"
    patterns:
      - pattern-regex: '(?m)^\s*uses:\s*(?!\./)(?!docker://)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)?@[a-fA-F0-9]{40}\s*$'

  - id: mcmc.docs.check-before-fix-command-order
    languages:
      - regex
    severity: WARNING
    message: "Document non-mutating check commands before mutating fix commands."
    metadata:
      category: maintainability
      rationale: "Contributor docs and help text should present validation before mutation."
    paths:
      include:
        - "/AGENTS.md"
        - "/CONTRIBUTING.md"
        - "/README.md"
        - "/docs/**/*.md"
        - "/justfile"
        - "/tests/semgrep/docs/**/*.md"
    pattern-either:
      - pattern-regex: '(?ms)\bjust\s+fix\b[^\n]*(?:\n[^\n]*){0,4}\bjust\s+check\b'
      - pattern-regex: '(?ms)\bjust\s+([A-Za-z0-9_]+)-fix\b[^\n]*(?:\n[^\n]*){0,4}\bjust\s+\1-check\b'

  - id: mcmc.python.no-broad-exception
    languages:
      - python
    severity: WARNING
    message: "Catch a specific exception type instead of broad Exception."
    metadata:
      category: maintainability
      rationale: >-
        Python tooling should surface expected failure modes explicitly instead
        of swallowing unrelated errors.
    paths:
      include:
        - "/scripts/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern-regex: '^\s*except\s+Exception(?:\s+as\s+\w+)?\s*:'

  - id: mcmc.python.no-raw-exception-in-tests
    languages:
      - python
    severity: WARNING
    message: "Raise a specific exception type in Python tests instead of raw Exception."
    metadata:
      category: maintainability
      rationale: "Typed exceptions make test failures and expected errors easier to diagnose."
    paths:
      include:
        - "/scripts/tests/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern: raise Exception(...)

  - id: mcmc.python.no-adhoc-completedprocess-mock
    languages:
      - python
    severity: WARNING
    message: "Use subprocess.CompletedProcess[str] instead of ad hoc Mock stdout/returncode objects."
    metadata:
      category: maintainability
      rationale: >-
        Command-wrapper tests should use the real subprocess result shape so
        mocks stay aligned with production subprocess APIs.
    paths:
      include:
        - "/scripts/tests/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  $PROC = Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = unittest.mock.Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = mock.Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = MagicMock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = unittest.mock.MagicMock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = mock.MagicMock(...)
                  ...
                  $PROC.stdout = ...
      - patterns:
          - pattern-either:
              - pattern: |
                  $PROC = Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = unittest.mock.Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = mock.Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = MagicMock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = unittest.mock.MagicMock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = mock.MagicMock(...)
                  ...
                  $PROC.returncode = ...
      - pattern: Mock(..., stdout=..., ...)
      - pattern: unittest.mock.Mock(..., stdout=..., ...)
      - pattern: mock.Mock(..., stdout=..., ...)
      - pattern: MagicMock(..., stdout=..., ...)
      - pattern: unittest.mock.MagicMock(..., stdout=..., ...)
      - pattern: mock.MagicMock(..., stdout=..., ...)
      - pattern: Mock(..., returncode=..., ...)
      - pattern: unittest.mock.Mock(..., returncode=..., ...)
      - pattern: mock.Mock(..., returncode=..., ...)
      - pattern: MagicMock(..., returncode=..., ...)
      - pattern: unittest.mock.MagicMock(..., returncode=..., ...)
      - pattern: mock.MagicMock(..., returncode=..., ...)

  - id: mcmc.python.no-untyped-defs-in-scripts
    languages:
      - python
    severity: WARNING
    message: "Add an explicit return annotation to script functions."
    metadata:
      category: maintainability
      rationale: "Typed script helpers are easier for ty and reviewers to reason about."
    paths:
      include:
        - "/scripts/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern-regex: '^( {0,4}|\t)(async\s+)?def\s+[A-Za-z_][A-Za-z0-9_]*\([^#\n]*\)\s*:'
