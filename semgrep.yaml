---
# Repository-owned Semgrep/OpenGrep rules.
#
# Keep this file small and project-specific. Broad default/community rules tend
# to duplicate Clippy, cargo-audit, and CodeQL. These rules encode local Rust
# policies that are easier to express structurally than with Clippy.

rules:
  - id: mcmc.rust.no-stdio-diagnostics-in-src
    languages:
      - rust
    severity: WARNING
    message: "Avoid stdout/stderr diagnostics in library src/ code."
    metadata:
      category: maintainability
      rationale: "Library code should return data or typed errors rather than printing diagnostics."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern: println!(...)
          - pattern: eprintln!(...)
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-nonfinite-unwrap-defaults
    languages:
      - rust
    severity: WARNING
    message: "Do not hide failed floating-point conversion with NaN or infinity defaults."
    metadata:
      category: correctness
      rationale: "MCMC probability code should reject or propagate non-finite values explicitly."
    paths:
      include:
        - "/src/**/*.rs"
    pattern-either:
      - pattern: $VALUE.unwrap_or(f64::NAN)
      - pattern: $VALUE.unwrap_or(f64::INFINITY)
      - pattern: $VALUE.unwrap_or(f64::NEG_INFINITY)
      - pattern: $VALUE.unwrap_or(std::f64::NAN)
      - pattern: $VALUE.unwrap_or(std::f64::INFINITY)
      - pattern: $VALUE.unwrap_or(std::f64::NEG_INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| f64::NAN)
      - pattern: $VALUE.unwrap_or_else(|| f64::INFINITY)
      - pattern: $VALUE.unwrap_or_else(|| f64::NEG_INFINITY)

  - id: mcmc.rust.no-production-unwrap-panic
    languages:
      - rust
    severity: WARNING
    message: "Avoid unwrap/expect/panic in non-test src/ code; return typed errors or document an invariant."
    metadata:
      category: correctness
      rationale: "Public library paths should fail explicitly rather than panicking on user input."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern: $VALUE.unwrap()
          - pattern: $VALUE.expect($MESSAGE)
          - pattern: panic!(...)
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-box-dyn-error-in-src
    languages:
      - rust
    severity: WARNING
    message: "Use McmcError or another typed error in src/ instead of dynamic error erasure."
    metadata:
      category: maintainability
      rationale: "Public fallible paths should preserve typed error contracts."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-regex: >-
          ^[ \t]*[^\n]*(\bBox\s*<\s*dyn\s+(std::error::)?Error\b|&\s*dyn\s+(std::error::)?Error\b|\banyhow::Error\b)
      - pattern-not-regex: '^[ \t]*(//|///|/\*|\*)'
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          mod $MOD {
              ...
          }
      - pattern-not-inside: |
          #[cfg(test)]
          fn $FUNC(...) {
              ...
          }

  - id: mcmc.rust.no-box-dyn-error-in-examples-benches
    languages:
      - rust
    severity: WARNING
    message: "Use a concrete crate error in examples and benchmarks instead of dynamic error erasure."
    metadata:
      category: maintainability
      rationale: "Examples and benchmarks should model typed error handling that users can copy."
    paths:
      include:
        - "/examples/**/*.rs"
        - "/benches/**/*.rs"
    patterns:
      - pattern-regex: >-
          ^[ \t]*[^\n]*(\bBox\s*<\s*dyn\s+(std::error::)?Error\b|&\s*dyn\s+(std::error::)?Error\b|\banyhow::Error\b)
      - pattern-not-regex: '^[ \t]*(//|///|/\*|\*)'

  - id: mcmc.rust.no-box-dyn-error-in-doctests
    languages:
      - rust
    severity: WARNING
    message: "Use concrete error types in doctests instead of Box<dyn Error> or other dynamic error erasure."
    metadata:
      category: maintainability
      rationale: "Doctests are public examples and should model typed, copyable error handling."
    paths:
      include:
        - "/src/**/*.rs"
    patterns:
      - pattern-either:
          - pattern-regex: >-
              ^\s*(//!|///).*dyn\s+(std::error::)?Error
          - pattern-regex: >-
              ^\s*(//!|///).*anyhow::Error
          - pattern-regex: >-
              (?s)/\*\*.*?(Box\s*<\s*dyn\s+(std::error::)?Error|&\s*dyn\s+(std::error::)?Error|anyhow::Error).*?\*/
          - pattern-regex: >-
              (?s)/\*!.*?(Box\s*<\s*dyn\s+(std::error::)?Error|&\s*dyn\s+(std::error::)?Error|anyhow::Error).*?\*/

  - id: mcmc.rust.no-clippy-allow-lints
    languages:
      - rust
    severity: WARNING
    message: "Use #[expect(..., reason = ...)] instead of #[allow(...)] for Clippy suppressions."
    metadata:
      category: maintainability
      rationale: "Clippy suppressions should be checked by the compiler and carry a stable reason."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/**/*.rs"
        - "/examples/**/*.rs"
      exclude:
        - "/tests/semgrep/**"
    pattern-regex: '^\s*#\s*\[\s*allow\s*\(\s*clippy::'

  - id: mcmc.rust.expect-requires-reason
    languages:
      - rust
    severity: WARNING
    message: 'Add reason = "..." to #[expect(...)] so lint suppressions remain auditable.'
    metadata:
      category: maintainability
      rationale: "Documented expectations make lint suppressions reviewable and less likely to go stale."
    paths:
      include:
        - "/src/**/*.rs"
        - "/tests/**/*.rs"
        - "/examples/**/*.rs"
      exclude:
        - "/tests/semgrep/**"
    patterns:
      - pattern-regex: '^\s*#\s*\[\s*expect\s*\([^\]\n]*\)\s*\]'
      - pattern-not-regex: '\breason\s*='

  - id: mcmc.rust.prefer-prelude-imports-in-examples
    languages:
      - rust
    severity: WARNING
    message: "Use markov_chain_monte_carlo::prelude imports in examples instead of deep module paths."
    metadata:
      category: maintainability
      rationale: "Examples should model the public import surface users are expected to copy."
    paths:
      include:
        - "/examples/**/*.rs"
    patterns:
      - pattern-regex: '^\s*use\s+markov_chain_monte_carlo::(chain|error|sampler|traits)::'
      - pattern-not-regex: '^\s*use\s+markov_chain_monte_carlo::prelude::'

  - id: mcmc.python.no-broad-exception
    languages:
      - python
    severity: WARNING
    message: "Catch a specific exception type instead of broad Exception."
    metadata:
      category: maintainability
      rationale: >-
        Python tooling should surface expected failure modes explicitly instead
        of swallowing unrelated errors.
    paths:
      include:
        - "/scripts/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern-regex: '^\s*except\s+Exception(?:\s+as\s+\w+)?\s*:'

  - id: mcmc.python.no-raw-exception-in-tests
    languages:
      - python
    severity: WARNING
    message: "Raise a specific exception type in Python tests instead of raw Exception."
    metadata:
      category: maintainability
      rationale: "Typed exceptions make test failures and expected errors easier to diagnose."
    paths:
      include:
        - "/scripts/tests/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern: raise Exception(...)

  - id: mcmc.python.no-adhoc-completedprocess-mock
    languages:
      - python
    severity: WARNING
    message: "Use subprocess.CompletedProcess[str] instead of ad hoc Mock stdout/returncode objects."
    metadata:
      category: maintainability
      rationale: >-
        Command-wrapper tests should use the real subprocess result shape so
        mocks stay aligned with production subprocess APIs.
    paths:
      include:
        - "/scripts/tests/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  $PROC = Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = unittest.mock.Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = mock.Mock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = MagicMock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = unittest.mock.MagicMock(...)
                  ...
                  $PROC.stdout = ...
              - pattern: |
                  $PROC = mock.MagicMock(...)
                  ...
                  $PROC.stdout = ...
      - patterns:
          - pattern-either:
              - pattern: |
                  $PROC = Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = unittest.mock.Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = mock.Mock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = MagicMock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = unittest.mock.MagicMock(...)
                  ...
                  $PROC.returncode = ...
              - pattern: |
                  $PROC = mock.MagicMock(...)
                  ...
                  $PROC.returncode = ...
      - pattern: Mock(..., stdout=..., ...)
      - pattern: unittest.mock.Mock(..., stdout=..., ...)
      - pattern: mock.Mock(..., stdout=..., ...)
      - pattern: MagicMock(..., stdout=..., ...)
      - pattern: unittest.mock.MagicMock(..., stdout=..., ...)
      - pattern: mock.MagicMock(..., stdout=..., ...)
      - pattern: Mock(..., returncode=..., ...)
      - pattern: unittest.mock.Mock(..., returncode=..., ...)
      - pattern: mock.Mock(..., returncode=..., ...)
      - pattern: MagicMock(..., returncode=..., ...)
      - pattern: unittest.mock.MagicMock(..., returncode=..., ...)
      - pattern: mock.MagicMock(..., returncode=..., ...)

  - id: mcmc.python.no-untyped-defs-in-scripts
    languages:
      - python
    severity: WARNING
    message: "Add an explicit return annotation to script functions."
    metadata:
      category: maintainability
      rationale: "Typed script helpers are easier for ty and reviewers to reason about."
    paths:
      include:
        - "/scripts/**/*.py"
      exclude:
        - "/tests/semgrep/**"
    pattern-regex: '^( {0,4}|\t)(async\s+)?def\s+[A-Za-z_][A-Za-z0-9_]*\([^#\n]*\)\s*:'
