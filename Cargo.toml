[package]
name = "markov-chain-monte-carlo"
version = "0.4.0"
authors = [ "Adam Getchell" ]
edition = "2024"
rust-version = "1.97.1"

description = "A composable Markov Chain Monte Carlo (MCMC) framework for arbitrary state spaces in Rust"
homepage = "https://github.com/acgetchell/markov-chain-monte-carlo"
documentation = "https://docs.rs/markov-chain-monte-carlo"
license = "BSD-3-Clause"
repository = "https://github.com/acgetchell/markov-chain-monte-carlo"
readme = "README.md"

keywords = [ "mcmc", "markov-chain", "monte-carlo", "sampling", "metropolis-hastings" ]
categories = [ "science", "mathematics", "algorithms" ]

[dependencies]
rand = "0.10.2"
serde = { version = "1.0.229", features = [ "derive" ], optional = true }

[features]
serde = [ "dep:serde" ]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"
proptest = "1.11.0"
serde_json = "1.0.151"

[[bench]]
name = "stepping"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
# Transitive dependency version conflicts are outside our control
multiple_crate_versions = "allow"
