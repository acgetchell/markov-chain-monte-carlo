[build-system]
requires = [ "setuptools>=83.0.0", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "markov-chain-monte-carlo-tooling"
version = "0.4.2"
description = "Python utility scripts for the markov-chain-monte-carlo Rust library"
readme = "scripts/README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
    { name = "Adam Getchell" },
]
keywords = [ "mcmc", "markov-chain", "monte-carlo", "rust", "tooling" ]
dependencies = [ "packaging>=26.2" ]

[project.optional-dependencies]
notebook = [
    "research-repo-tools[notebooks]==0.1.2",
    "matplotlib>=3.11.1",
    "polars>=1.43.2",
]

[project.urls]
"Homepage" = "https://github.com/acgetchell/markov-chain-monte-carlo"
"Documentation" = "https://docs.rs/markov-chain-monte-carlo"
"Repository" = "https://github.com/acgetchell/markov-chain-monte-carlo"
"Bug Tracker" = "https://github.com/acgetchell/markov-chain-monte-carlo/issues"

[project.scripts]
archive-performance = "archive_performance:main"
bench-compare = "bench_compare:main"
publish-performance-readme = "publish_performance_readme:main"
release-check = "release_check:main"
update-release-version = "update_release_version:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [ "archive_performance", "bench_compare", "publish_performance_readme", "release_check", "subprocess_utils", "update_release_version" ]

[dependency-groups]
dev = [
    { include-group = "tooling" },
    "actionlint-py==1.7.12.24",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "semgrep==1.177.0",
    "ty>=0.0.82",
]
notebook = [ "markov-chain-monte-carlo-tooling[notebook]" ]

tooling = [ "research-repo-tools==0.1.2" ]

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "markov-chain-monte-carlo"
formatter = "rumdl.toml"

[tool.research-repo-tools.release]
date-policy = "declared"

[tool.research-repo-tools.toolchain.cargo]
cargo-audit = "0.22.2"
cargo-edit = "0.13.13"
cargo-llvm-cov = "0.9.1"
cargo-nextest = "0.9.145"
dprint = "0.57.4"
git-cliff = "2.14.2"
rumdl = "0.2.74"
taplo-cli = "0.10.0"
typos-cli = "1.50.2"
zizmor = "1.30.1"

[tool.research-repo-tools.notebooks]
group = "notebook"
cwd = "."
output-dir = "target/notebooks"
timeout = 120
outputs = "clear"

[tool.research-repo-tools.semgrep]
config = "semgrep.yaml"
fixtures = "tests/semgrep"
namespace = "mcmc."
cwd = "tests/semgrep"

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/project_rules/rust_style.rs"]
"mcmc.rust.no-stdio-diagnostics-in-src" = 2
"mcmc.rust.no-nonfinite-unwrap-defaults" = 1
"mcmc.rust.no-production-unwrap-panic" = 3
"mcmc.rust.thinning-interval-parameters-use-refined-type" = 2
"mcmc.rust.step-telemetry-fields-private" = 5
"mcmc.rust.no-box-dyn-error-in-src" = 1
"mcmc.rust.public-error-enums-non-exhaustive" = 2
"mcmc.rust.no-clippy-allow-lints" = 1
"mcmc.rust.expect-requires-reason" = 1

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/project_rules/algebraic_float.rs"]
"mcmc.rust.no-algebraic-f64-operations" = 60

[tool.research-repo-tools.semgrep.counts."tests/semgrep/examples/erased_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 3

[tool.research-repo-tools.semgrep.counts."tests/semgrep/examples/typed_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 0

[tool.research-repo-tools.semgrep.counts."tests/semgrep/benches/erased_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 3

[tool.research-repo-tools.semgrep.counts."tests/semgrep/benches/typed_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 0

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/doctests/erased_error.rs"]
"mcmc.rust.no-box-dyn-error-in-doctests" = 3

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/doctests/typed_error.rs"]
"mcmc.rust.no-box-dyn-error-in-doctests" = 0

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/doctests/unwrap_expect.rs"]
"mcmc.rust.no-unwrap-expect-in-doctests" = 7

[tool.research-repo-tools.semgrep.counts."tests/semgrep/examples/unwrap_expect.rs"]
"mcmc.rust.no-unwrap-expect-in-benches-examples" = 2

[tool.research-repo-tools.semgrep.counts."tests/semgrep/benches/unwrap_expect.rs"]
"mcmc.rust.no-unwrap-expect-in-benches-examples" = 2

[tool.research-repo-tools.semgrep.counts."tests/semgrep/github-actions/workflow_actions.yml"]
"mcmc.github-actions.external-action-sha-pinned" = 1
"mcmc.github-actions.external-action-approved-allowlist" = 1
"mcmc.github-actions.external-action-version-comment" = 1

[tool.research-repo-tools.semgrep.counts."tests/semgrep/docs/check_fix_order.md"]
"mcmc.docs.check-before-fix-command-order" = 2

[tool.ruff]
line-length = 160
target-version = "py314"
src = [ "scripts" ]

[tool.ruff.lint]
select = [ "E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF" ]
fixable = [ "ALL" ]
unfixable = [  ]
ignore = [
    # Formatter conflicts
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)

    # CLI script patterns
    "PLR2004", # Magic value used in comparison - OK for CLI constants and thresholds
    "FBT001", # Boolean-typed positional argument - OK for CLI flags
    "FBT002", # Boolean default positional argument - OK for CLI flags
    "BLE001", # Do not catch blind exception - OK for CLI robustness
    "T201", # print found - OK for CLI output
    "TRY300", # Consider moving statement to else block - OK for CLI control flow
    "TRY301", # Abstract raise to inner function - OK for straightforward CLI error handling
    "ARG001", # Unused function argument - common in callbacks
    "ERA001", # Found commented-out code - OK for explanatory comments
    "EXE001", # Shebang present but file not executable - handled by packaging
    "PTH123", # open() should be replaced by Path.open() - OK for some call sites
    "EM102", # Exception must not use f-string - OK for CLI error messages
    "TRY003", # Avoid specifying long messages outside exception class - OK for CLI reporting
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**/*.py" = [
    "S101", # asserts are fine in tests
    "SLF001", # tests may call internal helpers
    "PT019", # @patch decorator params are not pytest fixtures
    "PLC0415", # test helpers may import inside functions
]

[tool.ruff.lint.isort]
known-first-party = [
    "archive_performance",
    "bench_compare",
    "publish_performance_readme",
    "release_check",
    "subprocess_utils",
    "update_release_version",
]
force-single-line = false
split-on-trailing-comma = true
combine-as-imports = true
order-by-type = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--color=yes" ]
testpaths = [ "scripts/tests" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]

[tool.uv]
required-version = "==0.12.17"
package = true
default-groups = [ "dev", "notebook" ]
