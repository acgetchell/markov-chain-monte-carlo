[project]
name = "markov-chain-monte-carlo-environment"
version = "0.0.0"
description = "Dependency-only environment for MCMC notebooks and consumer checks"
requires-python = ">=3.14"
dependencies = [  ]

[dependency-groups]
dev = [
    { include-group = "tooling" },
    "actionlint-py==1.7.12.25",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "semgrep==1.178.0",
    "ty>=0.0.82",
]
notebook = [ "research-repo-tools[notebooks]==0.1.7", "matplotlib>=3.11.1", "polars>=1.43.2" ]

tooling = [ "research-repo-tools==0.1.7" ]

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "markov-chain-monte-carlo"
formatter = "rumdl.toml"

[tool.research-repo-tools.release]
date-policy = "declared"
tag-policy = "canonical-stable"
required-files = [ "Cargo.lock", "pyproject.toml", "uv.lock", "CITATION.cff", "CHANGELOG.md", "README.md", "REFERENCES.md" ]
exclude = [ "docs/performance/**" ]

[[tool.research-repo-tools.release.rules]]
path = "CITATION.cff"
pattern = '''^doi:[ \t]*['"]?(?P<value>[^'"\s]+)['"]?[ \t]*(?:#.*)?\r?$'''
value = "10.5281/zenodo.20033111"

[[tool.research-repo-tools.release.rules]]
path = "README.md"
pattern = '\[!\[DOI\]\([^)]*\)\]\(https://doi\.org/(?P<value>[^)]+)\)'
value = "10.5281/zenodo.20033111"

[[tool.research-repo-tools.release.rules]]
path = "REFERENCES.md"
pattern = '^- DOI: <https://doi\.org/(?P<value>[^>]+)>[ \t]*\r?$'
value = "10.5281/zenodo.20033111"

[[tool.research-repo-tools.release.rules]]
path = "README.md"
pattern = 'https://(?:github\.com/acgetchell/markov-chain-monte-carlo/(?:blob|raw|tree)/|raw\.githubusercontent\.com/acgetchell/markov-chain-monte-carlo/)(?P<value>main|[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+)/[^\s)\]>"?#]+'
source = "tag"
count = 30
exclude = '/docs/(?:PERFORMANCE\.md(?:$|[?#])|archive/performance/|performance/)'

[tool.research-repo-tools.toolchain]
inherit-python = true

[tool.research-repo-tools.toolchain.binaries]
gitleaks = "8.30.1"
osv-scanner = "2.6.0"

[tool.research-repo-tools.toolchain.cargo]
cargo-audit = "0.22.2"
cargo-edit = "0.13.13"
cargo-llvm-cov = "0.9.1"
cargo-nextest = "0.9.146"
clippy-sarif = "0.8.0"
dprint = "0.57.4"
git-cliff = "2.14.2"
rumdl = "0.2.77"
sarif-fmt = "0.8.0"
taplo-cli = "0.10.0"
typos-cli = "1.50.3"
zizmor = "1.30.1"

[tool.research-repo-tools.zizmor]
persona = "regular"

[tool.research-repo-tools.notebooks]
group = "notebook"
cwd = "."
output-dir = "target/notebooks"
timeout = 120
outputs = "clear"

[tool.research-repo-tools.semgrep]
config = "semgrep.yaml"
fixtures = "tests/semgrep"
namespace = "mcmc."
cwd = "tests/semgrep"

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/project_rules/rust_style.rs"]
"mcmc.rust.no-stdio-diagnostics-in-src" = 2
"mcmc.rust.no-nonfinite-unwrap-defaults" = 1
"mcmc.rust.no-production-unwrap-panic" = 3
"mcmc.rust.thinning-interval-parameters-use-refined-type" = 2
"mcmc.rust.step-telemetry-fields-private" = 5
"mcmc.rust.no-box-dyn-error-in-src" = 1
"mcmc.rust.public-error-enums-non-exhaustive" = 2
"mcmc.rust.no-clippy-allow-lints" = 1
"mcmc.rust.expect-requires-reason" = 1

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/project_rules/algebraic_float.rs"]
"mcmc.rust.no-algebraic-f64-operations" = 60

[tool.research-repo-tools.semgrep.counts."tests/semgrep/examples/erased_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 3

[tool.research-repo-tools.semgrep.counts."tests/semgrep/examples/typed_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 0

[tool.research-repo-tools.semgrep.counts."tests/semgrep/benches/erased_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 3

[tool.research-repo-tools.semgrep.counts."tests/semgrep/benches/typed_error.rs"]
"mcmc.rust.no-box-dyn-error-in-examples-benches" = 0

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/doctests/erased_error.rs"]
"mcmc.rust.no-box-dyn-error-in-doctests" = 3

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/doctests/typed_error.rs"]
"mcmc.rust.no-box-dyn-error-in-doctests" = 0

[tool.research-repo-tools.semgrep.counts."tests/semgrep/src/doctests/unwrap_expect.rs"]
"mcmc.rust.no-unwrap-expect-in-doctests" = 7

[tool.research-repo-tools.semgrep.counts."tests/semgrep/examples/unwrap_expect.rs"]
"mcmc.rust.no-unwrap-expect-in-benches-examples" = 2

[tool.research-repo-tools.semgrep.counts."tests/semgrep/benches/unwrap_expect.rs"]
"mcmc.rust.no-unwrap-expect-in-benches-examples" = 2

[tool.research-repo-tools.semgrep.counts."tests/semgrep/github-actions/workflow_actions.yml"]
"mcmc.github-actions.external-action-sha-pinned" = 2
"mcmc.github-actions.external-action-approved-allowlist" = 2
"mcmc.github-actions.external-action-version-comment" = 2

[tool.research-repo-tools.semgrep.counts."tests/semgrep/docs/check_fix_order.md"]
"mcmc.docs.check-before-fix-command-order" = 2

[tool.ruff]
line-length = 160
src = [ "tests/tooling" ]

[tool.ruff.lint]
select = [ "E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TC", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF" ]
extend-select = [ "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206" ]
fixable = [ "ALL" ]
unfixable = [  ]
ignore = [
    # Formatter conflicts
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)

    "PLR2004", # Scientific constants and explicit expected values in consumer tests
]

[tool.ruff.lint.per-file-ignores]
"tests/tooling/**/*.py" = [
    "S101", # asserts are fine in tests
    "PLC0415", # test helpers may import inside functions
]
"*.ipynb" = [ "T201" ] # Scientific notebook summaries
"tests/semgrep/tests/tooling/python_exceptions.py" = [
    "ANN201", # Deliberately missing return annotation
    "BLE001", # Broad-exception negative fixtures
    "ERA001", # Semgrep ruleid/ok annotations are harness metadata
    "INP001", # Scanner input, not an importable package
    "S110", # Deliberate except/pass fixtures
    "SIM105", # Preserve explicit exception handlers for Semgrep
    "T201", # Visible exception handling in a negative fixture
    "TRY002", # Deliberate raw Exception
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = true
combine-as-imports = true
order-by-type = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--color=yes" ]
testpaths = [ "tests/tooling" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]

[tool.uv]
required-version = "==0.12.19"
package = false
default-groups = [ "dev", "notebook" ]
