name: Set up declared toolchain
description: Install the locked shared tooling and synchronize the declared toolchain.

inputs:
  tool:
    description: Optional catalog selection; release upload selects only minimal Rust and Cargo.
    default: ""
  cache:
    description: Cache uv and managed Cargo compilation; release jobs disable caches.
    default: "true"
  scanner:
    description: Set up only zizmor, gitleaks, or osv-scanner; empty installs the full contributor toolchain.
    default: ""

runs:
  using: composite
  steps:
    - name: Install declared uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version-file: pyproject.toml
        enable-cache: ${{ inputs.cache == 'true' }}
        # Restored Windows Python homes can be inaccessible to ty.
        cache-python: ${{ runner.os != 'Windows' }}

    - name: Cache managed Cargo compilation
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/rrt-cargo-build
        key: >-
          cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('rust-toolchain.toml', 'pyproject.toml', 'uv.lock', 'Cargo.lock', '.python-version')
          }}

    - name: Set up declared tools and development environment
      if: inputs.scanner == '' && inputs.tool == ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
        RESEARCH_REPO_TOOLS_CARGO_BUILD_HOME: ${{ runner.temp }}/rrt-cargo-build
      run: uv run --locked --managed-python --only-group tooling research-repo-tools setup

    - name: Set up selected tools and development environment
      if: inputs.scanner == '' && inputs.tool != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
        RESEARCH_REPO_TOOLS_CARGO_BUILD_HOME: ${{ runner.temp }}/rrt-cargo-build
        SELECTED_TOOL: ${{ inputs.tool }}
      run: |
        uv sync --locked --managed-python --group dev
        uv run --locked --no-sync research-repo-tools toolchain sync --tool "$SELECTED_TOOL"

    - name: Set up the declared scanner through the shared API
      if: inputs.scanner != ''
      shell: bash
      env:
        SCANNER: ${{ inputs.scanner }}
        GITHUB_TOKEN: ${{ github.token }}
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
        RESEARCH_REPO_TOOLS_CARGO_BUILD_HOME: ${{ runner.temp }}/rrt-cargo-build
      run: |
        case "$SCANNER" in
          zizmor|gitleaks|osv-scanner) ;;
          *) printf 'Unsupported scanner: %s\n' "$SCANNER" >&2; exit 2 ;;
        esac
        uv run --locked --managed-python --only-group tooling research-repo-tools toolchain sync --tool "$SCANNER"
        uv run --locked --managed-python --only-group tooling research-repo-tools toolchain export --tool "$SCANNER"

    - name: Expose checked tools to workflow actions
      if: inputs.scanner == ''
      shell: bash
      env:
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
        SELECTED_TOOL: ${{ inputs.tool }}
      run: |
        args=()
        if [[ -n "$SELECTED_TOOL" ]]; then args+=(--tool "$SELECTED_TOOL"); fi
        uv run --locked --no-sync --no-python-downloads research-repo-tools toolchain export "${args[@]}"
