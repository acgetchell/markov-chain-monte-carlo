name: Set up declared toolchain
description: Install the locked shared tooling and synchronize the declared toolchain.

runs:
  using: composite
  steps:
    - name: Install declared uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version-file: pyproject.toml
        enable-cache: true
        cache-python: true

    - name: Cache declared Rust and Cargo tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/rrt
        key: rrt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'pyproject.toml', 'uv.lock', '.python-version') }}
        restore-keys: rrt-${{ runner.os }}-${{ runner.arch }}-

    - name: Set up declared tools and development environment
      shell: bash
      env:
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
      run: uv run --locked --managed-python --only-group tooling research-repo-tools setup

    - name: Expose checked tools to workflow actions
      shell: bash
      env:
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
      run: |
        uv run --locked --group dev research-repo-tools toolchain run -- python - <<'PY'
        import os
        from pathlib import Path

        names = ("RESEARCH_REPO_TOOLS_HOME", "PATH", "CARGO_HOME", "RUSTUP_HOME", "RUSTUP_TOOLCHAIN", "RUSTUP_AUTO_INSTALL", "RUSTUP_NO_UPDATE_CHECK")
        lines = []
        for name in names:
            value = os.environ[name]
            if "\n" in value or "\r" in value:
                raise ValueError(f"Invalid environment value for {name}")
            lines.append(f"{name}={value}\n")
        with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8", newline="\n") as stream:
            stream.writelines(lines)
        PY
