name: CI

permissions:
  contents: read

concurrency:
  group: >
    ci-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repository-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Run repository tooling checks
        run: just ci-repository-tooling

  build:
    needs: repository-tooling
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Require repository tooling success
        if: ${{ cancelled() || needs.repository-tooling.result != 'success' }}
        shell: bash
        run: |
          echo "Repository tooling did not succeed or the workflow was cancelled."
          exit 1

      - name: Disable Git autocrlf on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Run CI checks
        run: just ci-native

  package:
    needs: repository-tooling
    if: >-
      github.repository == 'acgetchell/markov-chain-monte-carlo' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          cache: "false"

      - name: Prepare native dependency provenance
        run: just release-dependency-builds

      - name: Verify published dependency provenance
        run: just release-dependencies

      - name: Verify clean default and all-feature packages
        run: just release-package

  release-evidence:
    needs: [repository-tooling, build, package]
    if: >-
      github.repository == 'acgetchell/markov-chain-monte-carlo' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install registry tooling runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Fetch locked Cargo inputs for read-only verification
        run: |
          toolchain="$(uvx --no-config --isolated --managed-python --exclude-newer 2026-11-10T07:56:26Z \
            --from research-repo-tools==0.2.8 python -I -c \
            'from pathlib import Path; import tomllib; print(tomllib.loads(Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$toolchain" cargo fetch --locked
          RUSTUP_TOOLCHAIN="$toolchain" cargo fetch --locked --manifest-path benches/diagnostic_backends/Cargo.toml

      - name: Capture successful validation identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx --no-config --isolated --managed-python --exclude-newer 2026-11-10T07:56:26Z \
            --from research-repo-tools==0.2.8 python -I - <<'PY'
          import os
          import sys
          from pathlib import Path
          from research_repo_tools.cli import main
          from research_repo_tools.release_metadata import read_package_info
          root = Path.cwd()
          sys.exit(main([
              "release", "evidence", "create", "tooling/release-evidence.toml",
              "--checkout", str(root), "--commit", os.environ["GITHUB_SHA"],
              "--version", read_package_info(root).version,
              "--run-id", os.environ["GITHUB_RUN_ID"], "--attempt", os.environ["GITHUB_RUN_ATTEMPT"],
              "--output", str(Path(os.environ["RUNNER_TEMP"]) / "release-evidence/validation.json"),
          ]))
          PY

      - name: Sign original main validation evidence
        id: validation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-evidence/validation.json
          create-storage-record: false

      - name: Retain the signature bundle
        env:
          VALIDATION_BUNDLE: ${{ steps.validation.outputs.bundle-path }}
        run: cp "$VALIDATION_BUNDLE" "$RUNNER_TEMP/release-evidence/validation.sigstore.json"

      - name: Upload signed validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 30
