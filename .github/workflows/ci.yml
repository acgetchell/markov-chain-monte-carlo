name: CI

permissions:
  contents: read

concurrency:
  group: >
    ci-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NEXTEST_VERSION: "0.9.137"
  DPRINT_VERSION: "0.54.0"
  JUST_VERSION: "1.51.0"
  RUMDL_VERSION: "0.2.3"
  TAPLO_VERSION: "0.10.0"
  TYPOS_VERSION: "1.46.3"
  UV_VERSION: "0.11.16"
  ZIZMOR_VERSION: "1.25.2"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Disable Git autocrlf on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: ${{ matrix.target }}
          cache: true
          # toolchain, components, etc. are specified in rust-toolchain.toml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync Python tooling
        run: uv sync --locked --group dev

      - name: Install cargo-managed tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked just --version "${JUST_VERSION}"
          cargo install --locked dprint --version "${DPRINT_VERSION}"
          cargo install --locked rumdl --version "${RUMDL_VERSION}"
          cargo install --locked taplo-cli --version "${TAPLO_VERSION}"
          cargo install --locked typos-cli --version "${TYPOS_VERSION}"
          cargo install --locked zizmor --version "${ZIZMOR_VERSION}"
          cargo install --locked cargo-nextest --version "${CARGO_NEXTEST_VERSION}"

      - name: Run CI checks
        run: just ci
