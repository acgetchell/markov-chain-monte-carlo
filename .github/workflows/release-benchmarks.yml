name: Release Benchmarks
run-name: Release benchmark ${{ inputs.release_tag }}

# Write-token jobs install registry tooling and never check out benchmark code.
# Keep both resolution cutoffs aligned with the reviewed uv.lock snapshot.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag with a draft GitHub Release
        required: true
        type: string

concurrency:
  group: release-benchmarks-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_ASSET: markov-chain-monte-carlo-${{ inputs.release_tag }}-criterion-baseline.tar.gz
  RUST_BACKTRACE: 1

jobs:
  validate-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.preflight.outputs.commit }}
      target: ${{ steps.preflight.outputs.target }}
    steps:
      - name: Install registry tooling runner
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Capture the trusted draft release target
        id: preflight
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          uvx --no-config --isolated --managed-python --exclude-newer 2026-10-21T23:41:46Z \
            --from research-repo-tools==0.2.3 research-repo-tools --root "$RUNNER_TEMP" \
            performance release-draft "$GH_REPO" "$RELEASE_TAG" --commit "$commit" \
            --expected-title "$RELEASE_TAG" --output "$RUNNER_TEMP/release-target.json"
          printf 'commit=%s\n' "$(jq -er .commit "$RUNNER_TEMP/release-target.json")" >> "$GITHUB_OUTPUT"
          printf 'target=%s\n' "$(jq -ec . "$RUNNER_TEMP/release-target.json")" >> "$GITHUB_OUTPUT"

  release-baseline:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the captured checkout and unchanged tag
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.commit }}
        run: |
          test "$(git --no-pager rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git --no-pager rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain
        with:
          cache: "false"

      - name: Measure and package shared release baseline
        run: just performance-baseline "$RELEASE_TAG"

      - name: Upload temporary baseline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-baseline-${{ inputs.release_tag }}
          path: ${{ env.RELEASE_ASSET }}
          retention-days: 30
          if-no-files-found: error

  publish-baseline:
    needs: [validate-release, release-baseline]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install registry tooling runner
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Download release baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-baseline-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/baseline

      - name: Attach baseline to the draft for maintainer review
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ needs.validate-release.outputs.target }}
        run: |
          test -n "$RELEASE_TARGET"
          printf '%s\n' "$RELEASE_TARGET" > "$RUNNER_TEMP/release-target.json"
          uvx --no-config --isolated --managed-python --exclude-newer 2026-10-21T23:41:46Z \
            --from research-repo-tools==0.2.3 research-repo-tools --root "$RUNNER_TEMP" \
            performance release-upload "$GH_REPO" "$RELEASE_TAG" "$RUNNER_TEMP/baseline/$RELEASE_ASSET" \
            --target "$RUNNER_TEMP/release-target.json"
