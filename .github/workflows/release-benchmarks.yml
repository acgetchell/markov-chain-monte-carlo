name: Release Benchmarks
run-name: Release benchmark ${{ inputs.release_tag }}

# Attach a durable Criterion baseline to a draft GitHub Release, then publish
# it. Release jobs do not restore or save dependency caches because the archive
# is a long-lived comparison input rather than a development-speed optimization.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag with a draft GitHub Release
        required: true
        type: string

concurrency:
  group: release-benchmarks-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag }}
  RUST_BACKTRACE: 1

jobs:
  validate-release:
    # Draft releases require push access. Keep this token away from tagged code.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate draft GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vX.Y.Z syntax: $RELEASE_TAG" >&2
            exit 1
          fi

          release_state="$(
            gh release view "$RELEASE_TAG" --json isDraft,isImmutable \
              --jq '[.isDraft, .isImmutable] | @tsv'
          )"
          read -r release_draft release_immutable <<< "$release_state"
          if [[ "$release_draft" != "true" || "$release_immutable" != "false" ]]; then
            echo "::error::Release $RELEASE_TAG must exist as a mutable draft" >&2
            exit 1
          fi

  release-baseline:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release-asset: ${{ steps.package-baseline.outputs.asset }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Save release Criterion baseline
        run: just bench-save-baseline "$RELEASE_TAG"

      - name: Record release benchmark metadata
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          criterion_versions = [
              package["version"]
              for package in lock["package"]
              if package.get("name") == "criterion"
          ]
          if len(criterion_versions) != 1:
              raise SystemExit("expected exactly one Criterion package in Cargo.lock")

          metadata = {
              "schema": 2,
              "tag": os.environ["RELEASE_TAG"],
              "commit": subprocess.run(
                  ["git", "--no-pager", "rev-parse", "HEAD"],
                  check=True,
                  capture_output=True,
                  encoding="utf-8",
              ).stdout.strip(),
              "operating_system": platform.platform(),
              "architecture": platform.machine(),
              "rustc": subprocess.run(
                  ["rustc", "--version"],
                  check=True,
                  capture_output=True,
                  encoding="utf-8",
              ).stdout.strip(),
              "criterion_version": criterion_versions[0],
              "benchmark_harness_sha256": hashlib.sha256(
                  Path("benches/stepping.rs").read_bytes()
              ).hexdigest(),
          }
          Path("target/criterion/.mcmc-release-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Package release Criterion baseline
        id: package-baseline
        run: |
          set -euo pipefail

          asset="markov-chain-monte-carlo-${RELEASE_TAG}-criterion-baseline.tar.gz"
          tar -C target -czf "$asset" criterion
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload temporary baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-baseline-${{ inputs.release_tag }}
          path: ${{ steps.package-baseline.outputs.asset }}
          retention-days: 30
          if-no-files-found: error

  publish-baseline:
    needs: release-baseline
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-baseline-${{ inputs.release_tag }}

      - name: Attach baseline and publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ needs.release-baseline.outputs.release-asset }}
        run: |
          set -euo pipefail

          release_state="$(
            gh release view "$RELEASE_TAG" --json isDraft,isImmutable \
              --jq '[.isDraft, .isImmutable] | @tsv'
          )"
          read -r release_draft release_immutable <<< "$release_state"
          if [[ "$release_draft" != "true" || "$release_immutable" != "false" ]]; then
            echo "::error::Release $RELEASE_TAG is no longer a mutable draft" >&2
            exit 1
          fi

          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if grep -Fxq -- "$RELEASE_ASSET" <<< "$asset_names"; then
            download_dir="$(mktemp -d)"
            trap 'rm -rf "$download_dir"' EXIT
            gh release download "$RELEASE_TAG" --pattern "$RELEASE_ASSET" --dir "$download_dir"
            if ! cmp -s "$RELEASE_ASSET" "$download_dir/$RELEASE_ASSET"; then
              echo "::error::Existing release asset differs from this run; leaving the draft unpublished" >&2
              exit 1
            fi
          else
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET"
          fi
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Release baseline summary
        env:
          RELEASE_ASSET: ${{ needs.release-baseline.outputs.release-asset }}
        run: |
          set -euo pipefail

          {
            echo "### Release Benchmark Baseline"
            echo ""
            echo "Uploaded release asset and published draft: \`$RELEASE_ASSET\`"
          } >> "$GITHUB_STEP_SUMMARY"
