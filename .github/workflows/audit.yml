name: "Audit dependencies"

on:
  push:
    paths:
      - .github/workflows/audit.yml
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 6 * * 1" # Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: "0.22.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true # toolchain/components are specified in rust-toolchain.toml

      - name: Cache advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.ref_name }}-v1
          restore-keys: advisory-db-

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
          restore-keys: |
            cargo-audit-${{ runner.os }}-

      - name: Install cargo-audit
        run: |
          installed_version=""
          if command -v cargo-audit &> /dev/null; then
            installed_version="$(cargo audit --version)"
            installed_version="${installed_version#cargo-audit }"
          fi

          if [ "${installed_version}" != "${CARGO_AUDIT_VERSION}" ]; then
            cargo install --locked --force cargo-audit --version "${CARGO_AUDIT_VERSION}"
          fi

      - name: Run cargo audit
        run: |
          cargo audit --json > audit-results.json
          cargo audit

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-results
          path: audit-results.json
