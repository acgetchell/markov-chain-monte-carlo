name: "Audit dependencies"

on:
  push:
    paths:
      - .github/workflows/audit.yml
      - .github/actions/setup-toolchain/action.yml
      - pyproject.toml
      - uv.lock
      - rust-toolchain.toml
      - .python-version
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - .github/workflows/audit.yml
      - .github/actions/setup-toolchain/action.yml
      - pyproject.toml
      - uv.lock
      - rust-toolchain.toml
      - .python-version
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 6 * * 1" # Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared toolchain
        uses: $/.github/actions/setup-toolchain

      - name: Cache advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.ref_name }}-v1
          restore-keys: advisory-db-

      - name: Run cargo audit
        run: |
          set +e
          uv run --locked --group dev research-repo-tools toolchain run -- cargo audit --json > audit-results.json
          json_status=$?
          uv run --locked --group dev research-repo-tools toolchain run -- cargo audit
          readable_status=$?
          set -e

          if (( json_status != 0 )); then
            exit "$json_status"
          fi
          exit "$readable_status"

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-results
          path: audit-results.json
