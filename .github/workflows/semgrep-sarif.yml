name: Repository Rule SARIF

concurrency:
  group: >
    semgrep-sarif-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-sarif:
    name: Repository Rule SARIF Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version-file: pyproject.toml

      - name: Run repository Semgrep rules
        id: semgrep
        run: |
          uv run --locked --managed-python --group dev research-repo-tools files list \
            --exclude 'tests/semgrep/**' \
            --exclude 'docs/performance/**' \
            --null > "$RUNNER_TEMP/semgrep-inputs"
          mapfile -d '' -t scan_paths < "$RUNNER_TEMP/semgrep-inputs"
          # Semgrep misreads Python 3.15's positive RLIM_INFINITY on Linux.
          # Keep its inherited stack finite until semgrep/semgrep#11979 is fixed.
          if [[ "$(ulimit -Hs)" == unlimited ]]; then
            ulimit -s 1048576
          fi
          set +e
          uv run --locked --managed-python --group dev semgrep \
            --metrics off \
            --error \
            --strict \
            --timeout 30 \
            --config semgrep.yaml \
            --sarif \
            --output semgrep-results.sarif \
            -- "${scan_paths[@]}"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF results
        if: >-
          always() &&
          hashFiles('semgrep-results.sarif') != '' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-repository-rules
          wait-for-processing: true

      - name: Fail on repository rule findings
        if: steps.semgrep.outputs.exit_code != '0'
        run: exit 1
