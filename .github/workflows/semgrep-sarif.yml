name: Repository Rule SARIF

concurrency:
  group: >
    semgrep-sarif-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-sarif:
    name: Repository Rule SARIF Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml

      - name: Run repository Semgrep rules
        id: semgrep
        continue-on-error: true
        run: uv run --locked --managed-python --group dev just semgrep

      - name: Verify current Semgrep reports
        id: reports
        if: always() && !cancelled()
        continue-on-error: true
        run: uv run --locked --managed-python --group dev research-repo-tools semgrep check-reports --output target/security/semgrep

      - name: Upload SARIF results
        if: >-
          always() &&
          steps.reports.outcome == 'success' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: target/security/semgrep/semgrep.sarif
          category: semgrep-repository-rules
          wait-for-processing: true

      - name: Fail on repository rule findings or invalid reports
        if: always() && (steps.semgrep.outcome != 'success' || steps.reports.outcome != 'success')
        run: exit 1
